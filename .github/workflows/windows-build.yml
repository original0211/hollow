name: windows-build

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - "shared/**"
      - "cli/src/**"
      - ".github/workflows/windows-build.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Root test suite (M1 core, untouched)
        run: npm test
      - name: Windows deps (unit tests import the pairing libs)
        run: npm --prefix windows install --no-audit --no-fund
      - name: Windows skeleton syntax + vendor prep
        run: npm --prefix windows run check
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: TUN helper (NP-1114-19) vet + tests + windows cross-build
        working-directory: windows/tun-helper
        run: |
          go vet ./...
          go test ./...
          GOOS=windows go build ./...

  build:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: windows
        run: npm install --no-audit --no-fund
      - name: Build portable exe
        working-directory: windows
        run: npm run dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build TUN helper + stage Wintun (pinned)
        working-directory: windows/tun-helper
        shell: pwsh
        run: |
          go build -o ../dist/hollow-tun-helper.exe ./cmd/hollow-tun-helper
          Copy-Item third_party/wintun/wintun.dll ../dist/
          Copy-Item third_party/wintun/LICENSE.txt ../dist/WINTUN-LICENSE.txt
          Copy-Item third_party/gvisor/LICENSE.txt ../dist/GVISOR-LICENSE.txt
          ../dist/hollow-tun-helper.exe --check-dll
      - name: Packaging self-check (licenses present — NP-1114-25 item 7)
        shell: pwsh
        working-directory: windows
        run: |
          foreach ($f in @("dist/WINTUN-LICENSE.txt", "dist/GVISOR-LICENSE.txt", "dist/wintun.dll", "dist/hollow-tun-helper.exe")) {
            if (-not (Test-Path $f)) { Write-Error "MISSING from dist: $f"; exit 1 }
          }
          Write-Host "dist packaging check OK"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollow-windows-portable
          path: |
            windows/dist/*.exe
            windows/dist/wintun.dll
            windows/dist/WINTUN-LICENSE.txt
            windows/dist/GVISOR-LICENSE.txt
          if-no-files-found: error
