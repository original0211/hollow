name: windows-build

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Root test suite (M1 core, untouched)
        run: npm test
      - name: Windows skeleton syntax + vendor prep
        run: npm --prefix windows run check

  build:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: windows
        run: npm install --no-audit --no-fund
      - name: Build portable exe
        working-directory: windows
        run: npm run dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollow-windows-portable
          path: windows/dist/*.exe
          if-no-files-found: error
