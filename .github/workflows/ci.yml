# CI placeholder (M1 scaffold) — syntax check + smoke tests only. No deploy.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check worker/src/index.js && node --check cli/src/cli.js
      - name: Smoke tests
        run: node --test
