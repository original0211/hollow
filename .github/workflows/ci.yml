# CI placeholder (M1 scaffold) — syntax check + smoke tests only. No deploy.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check worker/src/index.js && node --check cli/src/cli.js
      - name: Smoke tests
        # Via the package script (scoped file list + --test-force-exit).
        # A bare `node --test` also discovers windows/tests/, whose bridge
        # suite only terminates under force-exit in its own workflow —
        # bare discovery hung this job (found NP-1114-23).
        run: npm test
