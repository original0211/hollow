# Android build (M3-0): gomobile AAR + debug APK.
# Scope: android/** and this file only. The other workflows stay in
# their lanes — `ci` is node-only (root npm test + syntax), and
# `windows-build` is path-filtered to windows/**. See android/README.md.
name: android-build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform + NDK (pinned)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Install gomobile (pinned)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Go lock suites — cache OFF (NP-1114-41)
        working-directory: android/core
        # core (golden vectors/transcript) and pairing (grammar
        # fixtures) read fixture files outside the Go package graph;
        # the test cache does not track those reads, so a fixture-only
        # change could report a cached false green. Lock suites always
        # run with -count=1; other suites keep normal caching below.
        run: go test -count=1 ./core/ ./pairing/
      - name: Go core unit tests (desktop)
        working-directory: android/core
        run: go test ./...
      - name: Bind the core AAR (arm64 only, D5)
        working-directory: android/core
        run: |
          gomobile init
          gomobile bind -target=android/arm64 -androidapi=26 -o ../app/libs/hollowcore.aar .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: APK sanity (applicationId + ABI)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "package: name='eu.org.brodydung.hollow'" > /dev/null
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libgojni.so" > /dev/null
          echo "APK OK: $APK"
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Release job (M3-5): manual-dispatch ONLY. The debug job above is
  # the per-push lane; this job is the versioned, signed lane — it
  # runs when a human dispatches it, signs from Secrets, and creates a
  # DRAFT GitHub Release (publishing stays a human decision).
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform + NDK (pinned)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Install gomobile (pinned)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Go lock suites — cache OFF (NP-1114-41)
        working-directory: android/core
        run: go test -count=1 ./core/ ./pairing/
      - name: Go core unit tests (desktop)
        working-directory: android/core
        run: go test ./...
      - name: Restore keystore from Secrets (temp only, wiped after)
        env:
          HOLLOW_KEYSTORE_B64: ${{ secrets.HOLLOW_KEYSTORE_B64 }}
        run: |
          if [ -z "$HOLLOW_KEYSTORE_B64" ]; then echo "HOLLOW_KEYSTORE_B64 secret is not set — see files/m3/release-runbook.md"; exit 1; fi
          echo "$HOLLOW_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hollow-release.jks"
          echo "HOLLOW_KEYSTORE_FILE=$RUNNER_TEMP/hollow-release.jks" >> "$GITHUB_ENV"
      - name: Bind the core AAR (arm64 only, D5)
        working-directory: android/core
        run: |
          gomobile init
          gomobile bind -target=android/arm64 -androidapi=26 -o ../app/libs/hollowcore.aar .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble release APK (signed from env)
        env:
          HOLLOW_KEYSTORE_PASSWORD: ${{ secrets.HOLLOW_KEYSTORE_PASSWORD }}
          HOLLOW_KEY_ALIAS: ${{ secrets.HOLLOW_KEY_ALIAS }}
          HOLLOW_KEY_PASSWORD: ${{ secrets.HOLLOW_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify signature + checksum (evidence for the runbook checklist)
        id: verify
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Draft GitHub Release (human publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ steps.verify.outputs.apk }}"
          gh release create "android-v${{ steps.verify.outputs.version }}" \
            --draft --title "Hollow Android v${{ steps.verify.outputs.version }}" \
            --notes-file release-notes-template.md \
            "$APK" "$APK.sha256"
      - name: Wipe keystore (always)
        if: always()
        run: rm -f "$RUNNER_TEMP/hollow-release.jks"
