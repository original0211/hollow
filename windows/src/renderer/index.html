<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Hollow</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <h1>Hollow</h1>
  <div class="sub">Windows MVP · M2-3 配置与配对</div>
  <div class="banner" id="queued-banner">服务端繁忙，已排队（等待中…）</div>
  <div class="confirm" id="import-confirm">
    <div><strong>确认导入这份配置？</strong></div>
    <div>目标 Worker 地址：<span class="mono" id="imp-worker"></span></div>
    <div id="imp-detail"></div>
    <div id="imp-warn"></div>
    <button class="danger" id="btn-imp-confirm">确认导入并覆盖</button>
    <button id="btn-imp-cancel">取消</button>
  </div>
  <div class="card">
    <div class="state" id="state">状态：—</div>
    <div class="sub" id="detail"></div>
    <div class="sub" id="stats"></div>
    <button class="primary" id="btn-connect">连接</button>
    <button id="btn-disconnect">断开</button>
  </div>
  <div class="card">
    <h2>配对</h2>
    <div class="sub" id="psk-status"></div>
    <div>服务端配对 V（写入 Worker secret <span class="mono">PSK_V_HEX</span>）</div>
    <div class="mono" id="verifier">—</div>
    <button id="btn-copy-v">复制 V</button>
    <button id="btn-test">测试连接（真实握手）</button>
    <div class="sub" id="test-result"></div>
  </div>
  <div class="card">
    <h2>设置</h2>
    <label>Worker 地址</label>
    <input type="text" id="worker-url" spellcheck="false">
    <button id="btn-save">保存</button>
  </div>
  <div class="card">
    <h2>导入 / 导出</h2>
    <label>粘贴 hollow:// 链接或配置 JSON（先预览、确认后才落盘）</label>
    <textarea id="import-text" rows="3" spellcheck="false"></textarea>
    <button id="btn-imp-preview">预览导入</button>
    <button id="btn-imp-file">从 .hollow.json 文件导入</button>
    <button id="btn-imp-qrfile">从二维码图片导入</button>
    <button id="btn-imp-clip">从剪贴板图片导入</button>
    <div class="sub" id="import-result"></div>
    <div>
      <button id="btn-export">导出配置（不含 PSK）</button>
      <button id="btn-export-psk">导出含 PSK…</button>
      <button id="btn-qr">生成本机配置二维码</button>
      <label><input type="checkbox" id="chk-qr-psk"> 二维码含 PSK（仅限自己的设备间转移）</label>
    </div>
    <img class="qr" id="qr-img" alt="本机配置二维码">
  </div>
  <div class="card"><h2>活动日志</h2><pre id="log"></pre></div>
  <script src="./renderer.js"></script>
</body>
</html>
